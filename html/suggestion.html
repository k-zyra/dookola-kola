<section class="suggestion-wrap" id="skrzynka">
  <div class="shell suggestion">
    <div class="suggestion-copy">
      <p class="eyebrow light"><span></span> Skrzynka skarg i pomysłów</p>
      <h2>Masz pomysł na coś nowego?</h2>
      <p>Podziel się nim anonimowo. Każdy głos może być początkiem kolejnego projektu.</p>
    </div>
    <form class="suggestion-form" id="suggestionForm">
      <label for="suggestionText">Twoja wiadomość</label>
      <textarea id="suggestionText" name="message" rows="4" required placeholder="Napisz, co możemy zrobić lepiej lub co warto zorganizować..."></textarea>
      <div class="form-bottom">
        <label class="checkbox"><input type="checkbox" id="anonymous" checked /><span></span> Wyślij anonimowo</label>
        <button class="button button-light" type="submit">Wyślij pomysł <span>→</span></button>
      </div>
      <p class="form-status" id="formStatus" role="status"></p>
    </form>
  </div>
</section>
